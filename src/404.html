<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LetsMeet</title>
  <script>
    // GitHub Pages SPA redirect: converts the path into a query param
    // so index.html can restore it as a proper client-side route
    var pathSegmentsToKeep = 1; // keep '/letsmeet' prefix
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
